name: Vue3 CI/CD Pipeline

on:
    push:
        branches: [main, develop, feature/*]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'

jobs:
    # ========== CI 阶段 ==========
    code-quality:
        name: 🛡️ 代码质量检查
        runs-on: ubuntu-latest
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 配置文件验证
              run: |
                  echo "🔍 验证配置文件..."
                  required_files=("package.json" "pnpm-lock.yaml" "vite.config.ts" "tsconfig.json")
                  for file in "${required_files[@]}"; do
                    if [ ! -f "$file" ]; then
                      echo "❌ 缺少文件: $file"
                      exit 1
                    fi
                  done
                  echo "✅ 配置文件验证通过"

            - name: 📝 提交信息检查
              if: github.event_name == 'push'
              run: |
                  echo "📝 检查提交信息..."
                  npx commitlint --from HEAD~1 --to HEAD --verbose

            - name: 🔍 ESLint 检查
              run: npx eslint . --ext .vue,.ts,.js --fix

            - name: 🎨 Prettier 格式化
              run: npx prettier --write "src/**/*.{vue,ts,js}"

            - name: 📐 TypeScript 类型检查
              run: npx vue-tsc --noEmit

            # - name: 🔒 安全扫描
            #   if: github.ref == 'refs/heads/main'
            #   run: npx audit --audit-level moderate

    build:
        name: 🏗️ 项目构建
        runs-on: ubuntu-latest
        needs: code-quality
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🏗️ 构建项目
              run: |
                  echo "🏗️ 开始构建..."
                  if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                    npx vite build --base=/personal-senior-engineering/
                  else
                    npx vite build
                  fi
                  echo "✅ 构建完成"

            - name: 📋 验证构建产物
              run: |
                  echo "📋 检查构建产物..."
                  if [ ! -f "dist/index.html" ]; then
                    echo "❌ 缺少 index.html"
                    exit 1
                  fi
                  echo "📊 产物大小: $(du -sh dist | cut -f1)"
                  echo "📁 文件数量: $(find dist -type f | wc -l)"
                  echo "✅ 构建产物验证通过"

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist-build
                  path: dist/
                  retention-days: 7

    # ========== CD 阶段 ==========
    deploy-preview:
        name: 🌐 预览部署
        runs-on: ubuntu-latest
        needs: build
        if: github.ref != 'refs/heads/main'
        environment:
            name: preview
            url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview-${{ github.ref_name }}

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist-build
                  path: ./preview-dist

            - name: 📊 预览信息
              run: |
                  echo "🌐 预览部署信息:"
                  echo "分支: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "产物大小: $(du -sh preview-dist | cut -f1)"
                  echo "📝 预览部署完成（实际部署需要配置具体服务）"

    deploy-production:
        name: 🚀 生产部署
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
        environment:
            name: production
            url: https://19980425472.github.io/personal-senior-engineering/

        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist-build
                  path: ./production-dist

            - name: 🏷️ 创建版本标签
              run: |
                  echo "🏷️ 创建版本标签..."
                  VERSION=$(node -p "require('./package.json').version")
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" -m "Release v$VERSION - ${{ github.sha }}"
                  git push origin "v$VERSION"
                  echo "✅ 版本标签 v$VERSION 创建完成"

            - name: 🚀 部署到 GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./production-dist
                  publish_branch: gh-pages
                  force_orphan: true
                  user_name: 'github-actions[bot]'
                  user_email: 'github-actions[bot]@users.noreply.github.com'

            - name: 🎉 部署成功通知
              run: |
                  echo " "
                  echo "🎉 ========================================="
                  echo "🎉 CI/CD 流程完成!"
                  echo "🎉 ========================================="
                  echo "🌐 生产环境: https://19980425472.github.io/personal-senior-engineering/"
                  echo "📱 访问地址: https://19980425472.github.io/personal-senior-engineering/"
                  echo "🏷️ 版本: v$(node -p "require('./package.json').version")"
                  echo "🕐 部署时间: $(date)"
                  echo "🔗 Commit: ${{ github.sha }}"
                  echo "📊 构建产物: $(du -sh production-dist | cut -f1)"
                  echo "🎉 ========================================="
                  echo " "
