name: CI/CD Pipeline

on:
    push:
        branches: [develop, test, staging, main, feature/*]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.*'
            - 'tsconfig.*'
            - 'eslint.config.*'
            - 'prettier.config.*'
            - 'lint-staged.config.*'
            - 'commitlint.config.*'

    pull_request:
        branches: [develop, test, staging, main]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.*'
            - 'tsconfig.*'
            - 'eslint.config.*'
            - 'prettier.config.*'
            - 'lint-staged.config.*'
            - 'commitlint.config.*'

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'
    BUILD_OUTPUT: 'dist'

jobs:
    # 配置文件完整性检查
    config-validation:
        name: 🛡️ 配置文件校验
        runs-on: ubuntu-latest
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 🔍 检查关键配置文件是否存在
              run: |
                  config_files=(
                    "package.json"
                    "pnpm-lock.yaml"
                    "vite.config.*"
                    "tsconfig.*"
                    "eslint.config.*"
                    "prettier.config.*"
                    "lint-staged.config.*"
                    "commitlint.config.*"
                  )
                  for pattern in "${config_files[@]}"; do
                    if ! compgen -G "$pattern" > /dev/null; then
                      echo "❌ 配置文件匹配模式 $pattern 未找到任何文件！"
                      exit 1
                    fi
                  done
                  echo "✅ 所有配置文件检查通过"

    # 统一的依赖安装和构建
    install-and-build:
        name: 📦 安装依赖和构建
        runs-on: ubuntu-latest
        needs: config-validation
        outputs:
            build-success: ${{ steps.build.outputs.success }}
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 为了 commitlint 需要完整历史

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 提交信息检查
              run: |
                  if [ "${{ github.event_name }}" == "push" ]; then
                    echo "📝 检查最近一次提交..."
                    pnpm commitlint --from HEAD~1 --to HEAD --verbose
                  elif [ "${{ github.event_name }}" == "pull_request" ]; then
                    echo "📝 检查 PR 中的所有提交..."
                    pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
                  fi

            - name: 🔍 ESLint 检查
              run: pnpm lint

            - name: 🎨 Prettier 格式检查
              run: pnpm format:check

            - name: 📐 TypeScript 类型检查
              run: pnpm type-check

            - name: 🔒 安全扫描
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
              run: pnpm audit --audit-level moderate

            - name: 🏗️ 构建项目
              id: build
              run: |
                  echo "🏗️ 开始构建项目..."
                  pnpm build
                  echo "✅ 项目构建完成"
                  echo "success=true" >> $GITHUB_OUTPUT

            - name: 📦 检查构建产物
              run: |
                  if [ ! -d "${{ env.BUILD_OUTPUT }}" ]; then
                    echo "❌ 构建产物目录不存在"
                    exit 1
                  fi
                  echo "✅ 构建产物检查通过"

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: ${{ env.BUILD_OUTPUT }}
                  retention-days: 7

    # ========== CD 部分 ==========

    # 自动部署 - 测试环境
    deploy-test:
        name: 🤖 自动部署测试环境
        runs-on: ubuntu-latest
        needs: install-and-build
        if: github.ref == 'refs/heads/test' && needs.install-and-build.outputs.build-success == 'true'
        environment:
            name: test

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🔍 验证下载的产物
              run: |
                  echo "🔍 验证下载的构建产物..."
                  if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
                    echo "❌ 下载的构建产物为空或不存在"
                    exit 1
                  fi
                  echo "✅ 构建产物下载验证通过"

            - name: 🚀 部署到测试环境
              run: |
                  echo "🚀 开始部署到测试环境..."
                  echo "分支: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  # 这里添加你的测试环境部署脚本
                  echo "✅ 测试环境部署完成"

    # 自动部署 - 预发布环境
    deploy-staging:
        name: 🤖 自动部署预发布环境
        runs-on: ubuntu-latest
        needs: install-and-build
        if: github.ref == 'refs/heads/staging' && needs.install-and-build.outputs.build-success == 'true'
        environment:
            name: staging

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🚀 部署到预发布环境
              run: |
                  echo "🚀 开始部署到预发布环境..."
                  echo "分支: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  # 这里添加你的预发布环境部署脚本
                  echo "✅ 预发布环境部署完成"

    # 自动部署 - main 环境
    deploy-main:
        name: 🤖 自动部署 main 环境
        runs-on: ubuntu-latest
        needs: install-and-build
        if: github.ref == 'refs/heads/main' && needs.install-and-build.outputs.build-success == 'true'
        environment:
            name: main

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🏷️ 创建版本标签
              run: |
                  echo "🏷️ 创建版本标签..."
                  VERSION=$(node -p "require('./package.json').version")
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
                  git tag -a "v$VERSION" -m "Release v$VERSION - ${{ github.ref_name }}"
                  git push origin "v$VERSION"
                  echo "✅ 版本标签 v$VERSION 创建完成"

            - name: 🚀 部署到 main 环境
              run: |
                  echo "🚀 开始部署到 main 环境..."
                  echo "分支: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "版本: v$(node -p "require('./package.json').version")"
                  # 这里添加你的 main 环境部署脚本
                  echo "✅ main 环境部署完成"

    # 手动部署 - production 环境
    deploy-production:
        name: 👑 手动部署生产环境
        runs-on: ubuntu-latest
        needs: install-and-build
        if: |
            github.event_name == 'workflow_dispatch' &&
            needs.install-and-build.outputs.build-success == 'true'
        environment:
            name: production

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🔐 显示部署信息
              run: |
                  echo "👑 生产环境手动部署"
                  echo "👤 触发用户: ${{ github.actor }}"
                  echo "分支: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "版本: v$(node -p "require('./package.json').version")"

            - name: 🏷️ 创建生产版本标签
              run: |
                  echo "🏷️ 创建生产版本标签..."
                  VERSION=$(node -p "require('./package.json').version")
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
                  git tag -a "prod-v$VERSION-$TIMESTAMP" -m "Production Release - v$VERSION - ${{ github.actor }}"
                  git push origin "prod-v$VERSION-$TIMESTAMP"
                  echo "✅ 生产版本标签创建完成"

            - name: 🚀 部署到生产环境
              run: |
                  echo "🚀 开始部署到生产环境..."
                  echo "👤 部署人: ${{ github.actor }}"
                  echo "版本: v$(node -p "require('./package.json').version")"
                  echo "🕐 部署时间: $(date)"
                  # 这里添加你的生产环境部署脚本
                  echo "✅ 生产环境部署完成"
