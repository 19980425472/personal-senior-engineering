name: Main Branch CI/CD

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'

jobs:
    # CI 阶段 - 代码质量和构建
    ci:
        name: 🛡️ 代码质量和构建
        runs-on: ubuntu-latest
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 代码检查
              run: |
                  echo "🔍 运行代码质量检查..."
                  npx eslint . --ext .vue,.ts,.js
                  npx prettier --check "src/**/*.{vue,ts,js}"
                  npx vue-tsc --noEmit
                  echo "✅ 代码检查通过"

            # - name: 🔒 安全扫描
            #   run: |
            #     echo "🔒 运行安全扫描..."
            #     npx audit --audit-level moderate
            #     echo "✅ 安全扫描通过"

            - name: 🏗️ 构建项目
              run: |
                  echo "🏗️ 开始构建项目..."
                  npx vite build
                  echo "✅ 项目构建完成"

            - name: 📦 验证构建产物
              run: |
                  echo "📦 验证构建产物..."
                  if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
                    echo "❌ 构建产物无效"
                    echo "当前目录内容:"
                    ls -la
                    exit 1
                  fi
                  echo "📊 构建产物大小: $(du -sh dist | cut -f1)"
                  echo "📁 构建产物内容:"
                  ls -la dist/
                  echo "✅ 构建产物验证通过"

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist-artifact
                  path: dist/
                  retention-days: 7
                  if-no-files-found: error # 如果没有文件则报错

    # CD 阶段 - main 分支部署
    deploy-main:
        name: 🚀 部署到生产环境
        runs-on: ubuntu-latest
        needs: ci
        environment:
            name: production

        steps:
            - name: 📥 检出代码（用于版本信息）
              uses: actions/checkout@v4

            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist-artifact
                  path: ./downloaded-dist # 下载到指定目录

            - name: 🔍 检查下载的文件
              run: |
                  echo "🔍 检查下载的构建产物..."
                  echo "当前目录内容:"
                  ls -la
                  echo "下载目录内容:"
                  ls -la downloaded-dist/

                  # 将构建产物移动到正确位置
                  if [ -d "downloaded-dist" ] && [ -n "$(ls -A downloaded-dist)" ]; then
                    echo "📦 移动构建产物到 dist 目录..."
                    rm -rf dist 2>/dev/null || true
                    mv downloaded-dist dist
                    echo "✅ 构建产物移动完成"
                  else
                    echo "❌ 下载的构建产物无效"
                    exit 1
                  fi

            - name: 🔍 部署前验证
              run: |
                  echo "🔍 部署前验证..."
                  # 验证 package.json 存在
                  if [ ! -f "package.json" ]; then
                    echo "❌ package.json 不存在"
                    exit 1
                  fi

                  # 验证构建产物
                  if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
                    echo "❌ 构建产物无效"
                    echo "当前目录内容:"
                    ls -la
                    echo "dist 目录内容:"
                    ls -la dist/ 2>/dev/null || echo "dist 目录不存在"
                    exit 1
                  fi

                  echo "✅ 部署前验证通过"
                  echo "📊 构建产物详情:"
                  echo "大小: $(du -sh dist | cut -f1)"
                  echo "文件数量: $(find dist -type f | wc -l)"

            - name: 🏷️ 创建版本标签
              run: |
                  echo "🏷️ 创建版本标签..."
                  # 从 package.json 读取版本
                  VERSION=$(node -p "require('./package.json').version")
                  echo "检测到版本: $VERSION"

                  # 配置 git
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

                  # 创建并推送标签
                  git tag -a "v$VERSION" -m "Production Release v$VERSION - ${{ github.sha }}"
                  git push origin "v$VERSION"
                  echo "✅ 版本标签 v$VERSION 创建完成"

            - name: 🚀 执行部署
              run: |
                  echo "🚀 开始部署到生产环境..."
                  echo "========================================"
                  echo "🎯 部署信息"
                  echo "========================================"
                  VERSION=$(node -p "require('./package.json').version")
                  echo "版本: v$VERSION"
                  echo "Commit: ${{ github.sha }}"
                  echo "触发方式: ${{ github.event_name }}"
                  echo "时间: $(date)"
                  echo "构建产物大小: $(du -sh dist | cut -f1)"
                  echo "构建产物文件: $(find dist -type f | wc -l) 个文件"
                  echo "========================================"

                  # 显示部分构建产物内容
                  echo "📁 主要构建文件:"
                  find dist -name "*.html" -o -name "*.js" | head -8 | while read file; do
                    echo "  📄 $file"
                  done

                  echo "✅ 部署准备完成"
                  echo "📝 请在此处添加实际部署脚本"

            - name: 📢 部署完成通知
              run: |
                  echo "📢 部署完成通知"
                  VERSION=$(node -p "require('./package.json').version")
                  echo "🎉 生产环境部署准备完成！"
                  echo "🏷️ 版本: v$VERSION"
                  echo "🔗 Commit: ${{ github.sha }}"
                  echo "🕐 时间: $(date)"
