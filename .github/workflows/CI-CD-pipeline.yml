name: CI/CD Pipeline

on:
    push:
        branches: [main, staging, test]
    pull_request:
        branches: [main]
    workflow_dispatch: # 手动触发生产部署

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'

jobs:
    # 基础验证和构建
    validate-and-build:
        name: 🛡️ 验证和构建
        runs-on: ubuntu-latest
        outputs:
            build-success: ${{ steps.build.outputs.success }}
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 为了 commitlint 需要完整历史

            - name: 🔍 基础文件验证
              run: |
                  # 只验证最关键的文件
                  required_files=("package.json" "pnpm-lock.yaml" "vite.config.ts" "tsconfig.json")
                  for file in "${required_files[@]}"; do
                    if [ ! -f "$file" ]; then
                      echo "❌ 关键文件 $file 不存在"
                      exit 1
                    fi
                  done
                  echo "✅ 基础文件验证通过"

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 📝 提交信息检查
              if: github.event_name == 'push'
              run: |
                  npx commitlint --from HEAD~1 --to HEAD --verbose

            - name: 🔍 代码质量检查
              run: |
                  # 使用硬编码命令，不依赖 package.json
                  npx eslint . --ext .vue,.ts,.js --config eslint.config.js
                  npx prettier --check "src/**/*.{vue,ts,js}" --config prettier.config.js
                  npx vue-tsc --noEmit

            - name: 🏗️ 构建项目
              id: build
              run: |
                  npx vite build --config vite.config.ts
                  echo "success=true" >> $GITHUB_OUTPUT

            - name: 📦 验证构建产物
              run: |
                  if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
                    echo "❌ 构建产物无效"
                    exit 1
                  fi
                  echo "✅ 构建产物验证通过"

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    # 安全扫描（仅主要分支）
    security-scan:
        name: 🔒 安全扫描
        runs-on: ubuntu-latest
        needs: validate-and-build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 依赖漏洞扫描
              run: npx audit --audit-level moderate

    # ========== 部署阶段 ==========

    # 测试环境部署（自动）
    deploy-test:
        name: 🤖 部署测试环境
        runs-on: ubuntu-latest
        needs: validate-and-build
        if: github.ref == 'refs/heads/test' && needs.validate-and-build.outputs.build-success == 'true'
        environment:
            name: test

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🚀 部署到测试环境
              run: |
                  echo "🚀 部署到测试环境 - ${{ github.sha }}"
                  # 你的测试环境部署脚本

    # 预发布环境部署（自动）
    deploy-staging:
        name: ⚡ 部署预发布环境
        runs-on: ubuntu-latest
        needs: [validate-and-build, security-scan]
        if: github.ref == 'refs/heads/staging' && needs.validate-and-build.outputs.build-success == 'true'
        environment:
            name: staging

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🚀 部署到预发布环境
              run: |
                  echo "🚀 部署到预发布环境 - ${{ github.sha }}"
                  # 你的预发布环境部署脚本

    # 生产环境部署（自动）
    deploy-production:
        name: 🚀 部署生产环境
        runs-on: ubuntu-latest
        needs: [validate-and-build, security-scan]
        if: github.ref == 'refs/heads/main' && needs.validate-and-build.outputs.build-success == 'true'
        environment:
            name: production

        steps:
            - name: 📥 下载构建产物
              uses: actions/download-artifact@v4
              with:
                  name: dist

            - name: 🏷️ 创建版本标签
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
                  git tag -a "v$VERSION" -m "Release v$VERSION"
                  git push origin "v$VERSION"
                  echo "✅ 版本 v$VERSION 已发布"

            - name: 🚀 部署到生产环境
              run: |
                  echo "🚀 部署到生产环境 - v$(node -p "require('./package.json').version")"
                  # 你的生产环境部署脚本

    # 手动生产部署（备用）
    # 手动生产部署（备用）
manual-deploy:
    name: 👑 手动生产部署
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: github.event_name == 'workflow_dispatch' && needs.validate-and-build.outputs.build-success == 'true'
    environment:
        name: production

    steps:
        - name: 📥 下载构建产物
          uses: actions/download-artifact@v4
          with:
              name: dist

        - name: 🔐 部署确认
          run: |
              echo "👑 手动生产部署"
              echo "负责人: ${{ github.actor }}"
              echo "Commit: ${{ github.sha }}"
              echo "时间: $(date)"
              echo "========================================"

        - name: 🔍 验证构建产物
          run: |
              echo "🔍 验证构建产物..."
              if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
                echo "❌ 构建产物无效"
                exit 1
              fi
              echo "📊 构建产物大小: $(du -sh dist | cut -f1)"
              echo "📁 主要文件:"
              find dist -type f -name "*.html" -o -name "*.js" -o -name "*.css" | head -10
              echo "✅ 构建产物验证通过"

        - name: 🏷️ 创建生产版本标签
          run: |
              echo "🏷️ 创建生产版本标签..."
              VERSION=$(node -p "require('./package.json').version")
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git tag -a "prod-v$VERSION-$TIMESTAMP" -m "Production Release v$VERSION - Deployed by ${{ github.actor }}"
              git push origin "prod-v$VERSION-$TIMESTAMP"
              echo "✅ 生产版本标签创建完成: prod-v$VERSION-$TIMESTAMP"

        - name: 🚀 部署到生产环境
          run: |
              echo "🚀 开始手动部署到生产环境..."
              echo "========================================"
              echo "🎯 部署信息"
              echo "========================================"
              echo "👤 部署人: ${{ github.actor }}"
              echo "🏷️ 版本: v$(node -p "require('./package.json').version")"
              echo "🔗 Commit: ${{ github.sha }}"
              echo "🕐 部署时间: $(date)"
              echo "📊 构建产物: $(du -sh dist | cut -f1)"
              echo "========================================"

              # ========== 这里替换为你的实际部署脚本 ==========

              # 示例1: GitHub Pages 部署
              # echo "🌐 部署到 GitHub Pages..."
