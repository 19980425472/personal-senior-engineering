              # 示例3: Netlify 部署
              # echo "🌐 部署到 Netlify..."
              # npx netlify-cli deploy --prod --dir=dist --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}

              # 示例4: 服务器 SSH 部署
              # echo "🖥️  通过 SSH 部署到服务器..."
              # mkdir -p ~/.ssh
              # echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
              # chmod 600 ~/.ssh/id_rsa
