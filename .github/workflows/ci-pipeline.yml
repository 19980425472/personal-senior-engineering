name: Vue3 CI Pipeline

on:
    push:
        branches: [develop, test, staging, main, feature/*]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.ts'
            - 'tsconfig.json'
            - 'prettier.config.js'
            - '.eslint-config.js'
            - 'lint-staged.config.js'
            - 'commitlint.config.js'

    pull_request:
        branches: [develop, test, staging, main]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.ts'
            - 'tsconfig.json'
            - 'prettier.config.js'
            - '.eslint-config.js'
            - 'lint-staged.config.js'
            - 'commitlint.config.js'

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'
    BUILD_OUTPUT: 'dist'

jobs:
    # 提交信息格式检查
    commitlint:
        name: 📝 提交信息检查
        runs-on: ubuntu-latest
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm' # 现在 pnpm 已经安装，可以正确缓存了

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 检查提交信息格式
              run: |
                  if [ "${{ github.event_name }}" == "push" ]; then
                    echo "检查最近一次提交..."
                    pnpm commitlint --from HEAD~1 --to HEAD --verbose
                  fi

                  if [ "${{ github.event_name }}" == "pull_request" ]; then
                    echo "检查 PR 中的所有提交..."
                    pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
                  fi

    # 代码质量检查
    code-quality:
        name: 📦 代码质量检查
        runs-on: ubuntu-latest
        needs: commitlint
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🔍 ESLint 检查
              run: pnpm lint

            - name: 🎨 Prettier 格式检查
              run: pnpm format:check

    # 构建检查
    build-check:
        name: 🏗️ 构建检查
        runs-on: ubuntu-latest
        needs: code-quality
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 🏗️ 构建项目
              run: pnpm build

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: ${{ env.BUILD_OUTPUT }}
                  retention-days: 7
