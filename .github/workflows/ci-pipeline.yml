name: CI Pipeline

on:
    push:
        branches: [develop, test, staging, main, feature/*]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.*'
            - 'tsconfig.*'
            - 'eslint-config .*'
            - 'prettier.config*'
            - 'lint-staged.config.*'
            - 'commitlint.config.*'

    pull_request:
        branches: [develop, test, staging, main]
        paths:
            - 'src/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'vite.config.*'
            - 'tsconfig.*'
            - 'eslint-config .*'
            - 'prettier.config*'
            - 'lint-staged.config.*'
            - 'commitlint.config.*'

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10'
    BUILD_OUTPUT: 'dist'

jobs:
    # 配置文件完整性检查
    config-validation:
        name: 🛡️ 配置文件校验
        runs-on: ubuntu-latest
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 🔍 检查关键配置文件是否存在
              run: |
                  # 使用通配符检查配置文件
                  config_files=(
                    "package.json"
                    "pnpm-lock.yaml"
                    "vite.config.*"
                    "tsconfig.*"
                    "eslint.config.*"
                    "prettier.config.*"
                    "lint-staged.config.*"
                    "commitlint.config.*"
                  )
                  for pattern in "${config_files[@]}"; do
                    if ! compgen -G "$pattern" > /dev/null; then
                      echo "❌ 配置文件匹配模式 $pattern 未找到任何文件！"
                      exit 1
                    fi
                  done
                  echo "✅ 所有配置文件检查通过"

    # 依赖安装（缓存优化）
    install-deps:
        name: 📦 依赖安装
        runs-on: ubuntu-latest
        needs: config-validation
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: 🟢 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: 📦 安装依赖
              run: pnpm install --frozen-lockfile

    # 提交信息检查
    commitlint:
        name: 📝 提交信息检查
        runs-on: ubuntu-latest
        needs: install-deps
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 恢复依赖
              uses: actions/cache@v3
              with:
                  path: |
                      node_modules
                      ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 🔍 检查提交信息格式
              run: |
                  if [ "${{ github.event_name }}" == "push" ]; then
                    echo "📝 检查最近一次提交..."
                    npx commitlint --from HEAD~1 --to HEAD --verbose
                  elif [ "${{ github.event_name }}" == "pull_request" ]; then
                    echo "📝 检查 PR 中的所有提交..."
                    npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
                  fi

    # 代码质量检查
    code-quality:
        name: 📦 代码质量检查
        runs-on: ubuntu-latest
        needs: install-deps
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 恢复依赖
              uses: actions/cache@v3
              with:
                  path: |
                      node_modules
                      ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 🔍 ESLint 检查
              run: npx eslint . --ext .vue,.ts,.js

            - name: 🎨 Prettier 格式检查
              run: npx prettier --check "src/**/*.{vue,ts,js,json,css,scss}"

            - name: 📐 TypeScript 类型检查
              run: npx vue-tsc --noEmit

    # 构建检查
    build:
        name: 🏗️ 构建检查
        runs-on: ubuntu-latest
        needs: [commitlint, code-quality]
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 恢复依赖
              uses: actions/cache@v3
              with:
                  path: |
                      node_modules
                      ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 🏗️ 构建项目
              run: pnpm build

            - name: 📦 检查构建产物
              run: |
                  if [ ! -d "${{ env.BUILD_OUTPUT }}" ]; then
                    echo "❌ 构建产物目录不存在"
                    exit 1
                  fi
                  echo "✅ 构建产物检查通过"

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: ${{ env.BUILD_OUTPUT }}
                  retention-days: 7

            - name: 📤 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7
                  # 确保使用相同的仓库
                  repository: ${{ github.repository }}

    # 安全扫描（可选）
    security:
        name: 🔒 安全扫描
        runs-on: ubuntu-latest
        needs: install-deps
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        steps:
            - name: 📥 检出代码
              uses: actions/checkout@v4

            - name: 📦 恢复依赖
              uses: actions/cache@v3
              with:
                  path: |
                      node_modules
                      ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 🔍 依赖漏洞扫描
              run: pnpm audit --audit-level moderate

            # - name: 📋 许可证检查
            #   run: npx license-checker --summary --onlyAllow "MIT;ISC;Apache-2.0"
